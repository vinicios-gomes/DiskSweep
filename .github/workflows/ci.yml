name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell scripts
        run: for f in shell/lib/*.sh shell/cleaners/*.sh shell/limpar-disco.sh scripts/*.sh; do bash -n "$f"; done
      - name: Cleaners answer the contract
        run: for f in shell/cleaners/*.sh; do "$f" name >/dev/null && "$f" kind >/dev/null; done
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift test
      - run: ./scripts/build-app.sh
