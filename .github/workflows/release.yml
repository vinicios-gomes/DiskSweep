name: Release
# Dispare criando uma tag a partir da main:  ./scripts/release.sh 1.2.0   (ou: git tag v1.2.0 && git push origin v1.2.0)
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    name: Build DMG and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tag must point to a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Unit tests
        run: swift test

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-app.sh

      - name: Build DMG
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/make-dmg.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" build/*.dmg build/*.dmg.sha256 \
            --title "DiskSweep $GITHUB_REF_NAME" --generate-notes --verify-tag $PRE
